<title>Blackwell Silicon to Scale</title>
<!--
  BLACKWELL — FROM SILICON TO SCALE
  A 154-second real-time 3D loop (Three.js r160, WebGL2). Silent. No input required.
  Story: data hall -> rack -> server -> RTX PRO 6000 card -> GB202 die -> GPC -> L2 -> TPC -> SM -> one processing
  block -> the SM as silicon -> under the electron microscope (polished to the transistors): register-file memory
  cells -> one 6T cell (hold, read) -> back out -> the 32 CUDA cores -> one core's floorplan (a generic FP32 fused
  multiply-add unit) -> one continuous microscope zoom into its multiplier's full-adder tiles -> one XOR cell at the array's edge (beside a wiring channel) ->
  one transistor cut in half -> its channel as atoms -> one silicon atom and its four bonds, then a continuous
  pull-back that re-assembles everything and returns to the hall. A field-of-view ruler (10 m … 0.1 nm) shows the
  scale throughout; parts are labelled in English with Korean in parentheses.
  Below the SM nothing appears, grows or unfolds: every structure is there from the first frame, too small to see,
  and becomes visible only because the camera zooms in (electron-microscope style, grey once the view is < 40 µm).
  Keys (optional): Space = pause/resume · R = restart · H = hide/show labels

  SOURCE: "NVIDIA RTX Blackwell GPU Architecture" whitepaper v1.1 (RTX PRO Blackwell).
    p.8  Fig. 3  full GB202 block diagram       -> chip layout (2 banks of GPCs, L2 between, MCs at edges)
    p.9  Fig. 4  GPC organization               -> Raster Engine, 8 TPCs x 2 SMs, 2 ROP partitions
    p.10 Fig. 5  SM organization                -> 4 partitions, FP32/INT32 + Tensor Core each, L1/Tex, RT Core
    p.12         GDDR7 memory subsystem         -> memory type used on the illustrative board
    p.45         full GB202 description         -> 92.2B transistors, 12 GPCs / 96 TPCs / 192 SMs, 16 x 32-bit MCs
    p.14, p.46   product tables (188 SMs)       -> NOT used for the schematic; see ARCH notes in the script.
    p.14, p.47   spec tables                    -> TSMC 4N process, 750 mm² die (die footprint is scaled to it)

  BOUNDARY: everything below the die surface is a logical schematic (block heights, spacing and
  explode motion are explanatory art, not a floorplan). Everything below the SM (its silicon view, the wiring
  stack, cells, transistors, gate stack and atoms) is an illustrative depiction with generic proportions — not
  NVIDIA's floorplan, not TSMC 4N design rules, not a real circuit; the whitepaper gives no geometry below the
  die. Switching is electrical. Physical constants used as-is: silicon lattice 0.543 nm (Si–Si 0.235 nm). The board, server, rack and hall are
  illustrative / conceptual and do not reproduce any specific NVIDIA product or system.
-->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Semi+Condensed:wght@500&family=Noto+Sans+KR:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1112;
    --ink: #eef1ec;
    --ink-dim: #a3aca5;
    --green: #76b900;
    --face: "Barlow", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
    --face-sub: "Barlow Semi Condensed", "Barlow", "Helvetica Neue", Arial, sans-serif;
    --face-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
  #frame {
    position: relative; width: min(100vw, 100vh); height: min(100vw, 100vh);
    max-width: 100%; overflow: hidden; background: var(--bg); container-type: size;
  }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grade {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 110% at 50% 44%, rgba(0,0,0,0) 58%, rgba(0,0,0,.42) 100%);
  }
  #caption {
    position: absolute; left: 7%; right: 7%; bottom: 7%;
    pointer-events: none; opacity: 0; will-change: opacity, transform;
  }
  #caption::before {             /* soft scrim so the lines stay readable over bright subjects */
    content: ''; position: absolute; z-index: -1; left: -14%; right: -10%; top: -45%; bottom: -60%;
    background: radial-gradient(70% 62% at 34% 62%, rgba(4,6,8,.62), rgba(4,6,8,.32) 55%, rgba(4,6,8,0) 100%);
  }
  #caption .rule { width: 2.6cqw; min-width: 14px; height: 2px; background: var(--green); margin-bottom: 1.4cqw; }
  #cap-main {
    font-family: var(--face); font-weight: 600; text-transform: uppercase;
    font-size: clamp(15px, 3.7cqw, 44px); line-height: 1.08; letter-spacing: .06em;
    text-wrap: balance; text-shadow: 0 1px 12px rgba(0,0,0,.55);
  }
  #cap-sub {
    font-family: var(--face-sub); font-weight: 500; text-transform: uppercase;
    font-size: clamp(11px, 1.95cqw, 23px); line-height: 1.3; letter-spacing: .12em;
    color: var(--ink-dim); margin-top: .7em; text-wrap: balance; text-shadow: 0 1px 3px rgba(0,0,0,.75), 0 1px 12px rgba(0,0,0,.6);
  }
  #cap-ko {
    font-family: var(--face-ko); font-weight: 500; font-size: clamp(11px, 1.85cqw, 22px); line-height: 1.4;
    letter-spacing: .01em; color: #c9d0ca; margin-top: .45em; text-wrap: balance; word-break: keep-all;
    text-shadow: 0 1px 3px rgba(0,0,0,.75), 0 1px 12px rgba(0,0,0,.6);
  }
  #frame.nolabels #caption, #frame.nolabels #hud, #frame.nolabels #tags { display: none; }
  /* part labels pinned to the 3D view: English name, Korean in parentheses, a dot on the part */
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #tags .tag { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  #tags .tag > div { position: absolute; left: 0; bottom: 0; transform: translate(-50%, -12px); white-space: nowrap; text-align: center;
    padding: .32em .6em .36em; background: rgba(8,10,12,.68); border: 1px solid rgba(118,185,0,.5); border-radius: 3px; }
  #tags .tag b { display: block; font: 600 clamp(8px, 1.45cqw, 15px)/1.15 var(--face); letter-spacing: .03em; color: #eef3ea; }
  #tags .tag i { display: block; font: 500 clamp(7px, 1.25cqw, 13px)/1.2 var(--face-ko); font-style: normal; color: #c9d0ca; margin-top: .12em; }
  #tags .tag::before { content: ''; position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 6px rgba(118,185,0,.9); }
  #tags .tag::after { content: ''; position: absolute; left: -.5px; bottom: 0; width: 1px; height: 12px; background: rgba(118,185,0,.75); }
  /* field-of-view ruler: ten metres to a tenth of a nanometre, the marker follows the camera */
  #hud { position: absolute; right: 4.2%; top: 6.5%; height: 40%; width: 30cqw; pointer-events: none; }
  #hud-title { position: absolute; right: 0; top: -2.9cqw; font: 500 clamp(8px, 1.3cqw, 14px)/1 var(--face-sub); letter-spacing: .14em;
    text-transform: uppercase; color: rgba(233,238,234,.5); white-space: nowrap; }
  #hud-title span { font-family: var(--face-ko); letter-spacing: 0; text-transform: none; }
  #hud-line { position: absolute; right: 0; top: 0; bottom: 0; width: 1px; background: rgba(233,238,234,.25); }
  #hud .tick { position: absolute; right: 0; width: .9cqw; height: 1px; background: rgba(233,238,234,.4); }
  #hud .tick span { position: absolute; right: 1.5cqw; top: -.62em; font: 500 clamp(7px, 1.3cqw, 14px)/1 var(--face-sub);
    letter-spacing: .05em; color: rgba(233,238,234,.42); white-space: nowrap; }
  #hud-mark { position: absolute; right: -.5cqw; width: 2.2cqw; height: 2px; margin-top: -1px; background: var(--green);
    box-shadow: 0 0 8px rgba(118,185,0,.7); }
  #hud-val { position: absolute; right: 9.6cqw; margin-top: -.62em; font: 600 clamp(9px, 1.75cqw, 19px)/1 var(--face);
    letter-spacing: .04em; color: #cfe8a8; white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #err {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 0 10%;
    font: 500 15px/1.5 var(--face); color: var(--ink); text-align: center; background: var(--bg);
  }
  #err b { display: block; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin-bottom: .5em; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
</style>

<body>
<div id="stage">
  <div id="frame">
    <div id="grade"></div>
    <div id="caption"><div class="rule"></div><div id="cap-main"></div><div id="cap-sub"></div><div id="cap-ko" lang="ko"></div></div>
    <div id="tags" aria-hidden="true"></div>
    <div id="hud" aria-hidden="true"><div id="hud-title">Field of view <span>(화면 폭)</span></div><div id="hud-line"></div><div id="hud-mark"></div><div id="hud-val"></div></div>

<script>
  // Classic (non-module) guard: reports a visible error if the module graph never starts.
  window.__showError = function (msg) {
    var box = document.getElementById('err');
    document.getElementById('err-msg').textContent = msg;
    box.hidden = false;
  };
  window.__bootTimer = setTimeout(function () {
    if (!window.__started) window.__showError('The 3D engine did not load (network or CDN blocked). Reload the page to try again.');
  }, 15000);
  window.addEventListener('error', function (e) {
    if (!window.__started && e && e.message) window.__showError('Startup error: ' + e.message);
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =====================================================================================
   1. ARCHITECTURE DATA — documented values only (whitepaper v1.1).
   Every architectural count on screen or in geometry is derived from this one object.
   ===================================================================================== */
const ARCH = Object.freeze({
  chip: 'GB202',
  gpcs: 12,                 // p.8, p.45 — full GB202
  tpcPerGpc: 8,             // p.9 Fig. 4
  smPerTpc: 2,              // p.9 ("Each TPC includes one PolyMorph Engine and two SMs")
  ropPartitionsPerGpc: 2,   // p.9
  sm: Object.freeze({       // p.9–10 Fig. 5
    partitions: 4, cudaCores: 128, tensorCores: 4, rtCores: 1, texUnits: 4,
    regFileEntries: 16384, regFileBits: 32,   // p.10 Fig. 5: "Register File (16,384 x 32-bit)" per processing block
    l1KB: 128, threadsPerClk: 32,             // p.10 Fig. 5: 128 KB L1 data cache / shared memory; dispatch 32 thread/clk
  }),
  l2MB: 128,                // p.9, p.45 (131,072 KB)
  memControllers: 16,       // p.8, p.45 — sixteen 32-bit controllers
  memControllerBits: 32,
  transistorsBillion: 92.2, // p.45
  memoryType: 'GDDR7',      // p.12
  dieAreaMM2: 750,          // p.47 table (GB202 die size)
  process: 'TSMC 4N',       // p.14 / p.47 tables ("TSMC 4nm 4N NVIDIA Custom Process")
});
// p.14 / p.46 list RTX PRO 6000 products with 188 SMs and 24,064 CUDA cores, while p.8 states they use
// the full GB202. That discrepancy is NOT reconciled here: the schematic is the full 192-SM chip, and no
// claim is made about which SMs are enabled on a retail card (no disabled SMs are invented or placed).
const DERIVED = Object.freeze((() => {
  const tpcs = ARCH.gpcs * ARCH.tpcPerGpc;
  const sms = tpcs * ARCH.smPerTpc;
  return {
    tpcs, sms, smPerGpc: ARCH.tpcPerGpc * ARCH.smPerTpc,
    cuda: sms * ARCH.sm.cudaCores, tensor: sms * ARCH.sm.tensorCores, rt: sms * ARCH.sm.rtCores,
    busBits: ARCH.memControllers * ARCH.memControllerBits,
    cudaPerPartition: ARCH.sm.cudaCores / ARCH.sm.partitions,
    tensorPerPartition: ARCH.sm.tensorCores / ARCH.sm.partitions,
  };
})());
const DOCUMENTED_TOTALS = { tpcs: 96, sms: 192, cuda: 24576, tensor: 768, rt: 192, busBits: 512 };
const ARCH_CHECK = Object.entries(DOCUMENTED_TOTALS).map(([k, v]) => ({ key: k, derived: DERIVED[k], documented: v, ok: DERIVED[k] === v }));
ARCH_CHECK.forEach(c => console.assert(c.ok, `ARCH mismatch: ${c.key} derived ${c.derived} vs documented ${c.documented}`));
// CUDA-core grid inside one SM partition (Fig. 5 draws FP32/INT32 as 4 columns): rows derived from data.
const CORE_COLS = 4;
const CORE_ROWS = DERIVED.cudaPerPartition / CORE_COLS; // 32 / 4 = 8
const fmt = n => n.toLocaleString('en-US');

/* =====================================================================================
   2. RENDERER, SCENE, CAMERA, LIGHTS
   ===================================================================================== */
const frameEl = document.getElementById('frame');
const canvas = document.createElement('canvas');
frameEl.prepend(canvas);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false });
} catch (e) {
  window.__showError('WebGL is not available in this browser or device.');
  throw e;
}
if (!renderer.capabilities.isWebGL2) {
  window.__showError('This piece needs WebGL 2, which this browser does not provide.');
  throw new Error('WebGL2 unavailable');
}
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const BG = new THREE.Color(0x0f1112);
scene.background = BG;
scene.fog = new THREE.Fog(BG, 1, 10);
// Floating origin: all content hangs off worldRoot, which is shifted every frame so the camera's subject
// sits at (0,0,0). Keeps float32 GPU precision intact from the nanoscale transistor scene to the 20 m hall.
const worldRoot = new THREE.Group();
scene.add(worldRoot);

const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);
// Atmospheric falloff is measured from the shot's subject (camera target), so each scale only reveals
// its immediate surroundings; pulling back widens the lit volume. Applies to all built-in materials.
const FOG_CENTER = { value: new THREE.Vector3() };
// (measured per pixel: a large surface would otherwise interpolate the fog of its far corners across its middle)
THREE.ShaderChunk.fog_pars_vertex = '#ifdef USE_FOG\n varying vec3 vFogWP;\n#endif';
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  {
    vec4 fogWP = vec4(transformed, 1.0);
    #ifdef USE_INSTANCING
      fogWP = instanceMatrix * fogWP;
    #endif
    vFogWP = (modelMatrix * fogWP).xyz;
  }
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
  uniform vec3 fogColor; varying vec3 vFogWP; uniform vec3 uFogCenter;
  #ifdef FOG_EXP2
    uniform float fogDensity;
  #else
    uniform float fogNear; uniform float fogFar;
  #endif
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  float vFogDepth = distance(vFogWP, uFogCenter);
  #ifdef FOG_EXP2
    float fogFactor = 1.0 - exp(- fogDensity * fogDensity * vFogDepth * vFogDepth);
  #else
    float fogFactor = smoothstep(fogNear, fogFar, vFogDepth);
  #endif
  gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, fogFactor);
#endif`;

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

const hemi = new THREE.HemisphereLight(0xd6ded8, 0x16181a, 0.6);
scene.add(hemi);
const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0004;
scene.add(keyLight, keyLight.target);
const rimLight = new THREE.DirectionalLight(0xc4d8ff, 1.1);
scene.add(rimLight, rimLight.target);
// Light directions in world space (the key light is re-fitted to the current scale every frame).
const KEY_DIR = new THREE.Vector3(-0.42, 1.0, 0.62).normalize();
const RIM_DIR = new THREE.Vector3(0.7, 0.45, -0.8).normalize();
const fillLight = new THREE.DirectionalLight(0xdfe6ee, 0.7);        // mirrored fill for faces turned away from the key
fillLight.position.set(0.35, 0.8, -0.6); scene.add(fillLight);

/* =====================================================================================
   3. SMALL UTILITIES (pure functions of time — no per-frame accumulation anywhere)
   ===================================================================================== */
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const range = (t, a, b) => clamp01((t - a) / (b - a));
const smoother = x => x * x * x * (x * (x * 6 - 15) + 10);
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
// 0 before a, rises to 1 by b, holds, falls to 0 between c and d
const pulse = (t, a, b, c, d) => smoother(range(t, a, b)) * (1 - smoother(range(t, c, d)));
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- shared geometry ---------- */
const GEO = {
  box: new THREE.BoxGeometry(1, 1, 1),
  rbox: new RoundedBoxGeometry(1, 1, 1, 2, 0.04),
  cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 24),
};

/* ---------- materials ---------- */
function std(color, metalness, roughness, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, metalness, roughness, ...extra });
}
function phys(color, metalness, roughness, extra = {}) {
  return new THREE.MeshPhysicalMaterial({ color, metalness, roughness, ...extra });
}
function mesh(geo, mat, parent, sx = 1, sy = 1, sz = 1, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
// Box placed by its minimum corner is error-prone; these helpers place by center.
const boxAt = (mat, parent, w, h, d, x, y, z, round = false) => mesh(round ? GEO.rbox : GEO.box, mat, parent, w, h, d, x, y, z);

/* ---------- procedural canvas textures (generated once) ---------- */
function canvasTex(w, h, draw, srgb = true, repeat = null) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
// Brushed-metal streaks, used as a bump/roughness modulation.
const TEX_BRUSH = canvasTex(512, 512, (g, w, h) => {
  const r = mulberry32(7);
  g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) {
    const y = r() * h, len = 40 + r() * 260, x = r() * w, v = 110 + r() * 40;
    g.strokeStyle = `rgba(${v},${v},${v},${0.25 + r() * 0.35})`;
    g.lineWidth = 0.6 + r() * 1.1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y + (r() - 0.5) * 1.2); g.stroke();
  }
}, false, [3, 3]);
// Perforated sheet metal (server vents, backplate windows).
const TEX_PERF = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#9aa0a4'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#0b0c0d';
  const s = 16;
  for (let j = 0; j < h / s + 1; j++) for (let i = 0; i < w / s + 1; i++) {
    const x = i * s + (j % 2) * s / 2, y = j * s * 0.866;
    g.beginPath(); g.arc(x, y, s * 0.3, 0, Math.PI * 2); g.fill();
  }
}, true, [1, 1]);
// PCB top: dark graphite solder mask with faint copper routing (subtle, board-scale detail).
const TEX_PCB = canvasTex(2048, 1024, (g, w, h) => {
  const r = mulberry32(21);
  g.fillStyle = '#161a18'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 520; i++) {
    let x = r() * w, y = r() * h;
    g.strokeStyle = r() < 0.85 ? 'rgba(52,62,56,0.55)' : 'rgba(120,92,52,0.35)';
    g.lineWidth = 1 + r() * 2.5;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 4; k++) {
      const horiz = r() < 0.5, len = 30 + r() * 220;
      if (r() < 0.3) { x += len * 0.7; y += (r() < 0.5 ? -1 : 1) * len * 0.7; }
      else if (horiz) x += (r() < 0.5 ? -1 : 1) * len; else y += (r() < 0.5 ? -1 : 1) * len;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  for (let i = 0; i < 900; i++) {
    g.fillStyle = r() < 0.7 ? 'rgba(90,96,90,0.55)' : 'rgba(150,118,70,0.6)';
    g.beginPath(); g.arc(r() * w, r() * h, 1.5 + r() * 2, 0, Math.PI * 2); g.fill();
  }
});

/* ---------- shader patch: narrow light sweep ("sheen") across the finished card ---------- */
const SHEEN = {
  uSheenAxis: { value: new THREE.Vector3(0, 0, 1) },
  uSheenPos: { value: -1e9 },
  uSheenAmt: { value: 0 },
  uSheenW: { value: 18 },
};
function addSheen(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, SHEEN);
    sh.vertexShader = 'varying vec3 vSheenW;\n' + sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
      vec4 shw = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        shw = instanceMatrix * shw;
      #endif
      vSheenW = (modelMatrix * shw).xyz;`);
    sh.fragmentShader = 'uniform vec3 uSheenAxis; uniform float uSheenPos; uniform float uSheenAmt; uniform float uSheenW; varying vec3 vSheenW;\n' +
      sh.fragmentShader.replace('#include <opaque_fragment>', `
      {
        float sd = dot(vSheenW, uSheenAxis) - uSheenPos;
        float sb = exp(-sd * sd / (uSheenW * uSheenW));
        float fr = pow(1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), 1.4);
        outgoingLight += vec3(0.92, 0.96, 1.0) * sb * uSheenAmt * (0.18 + 0.82 * fr);
      }
      #include <opaque_fragment>`);
  };
  mat.customProgramCacheKey = () => 'sheen';
  return mat;
}

/* =====================================================================================
   2b. FINISHING PIPELINE: MSAA HDR render -> ground-truth AO (scale-aware radius) -> macro-lens depth of
   field (only when the subject is small) -> restrained bloom on emitters -> ACES tone map -> fine grain.
   ===================================================================================== */
const composerTarget = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerTarget);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.blendIntensity = 0.9;
gtao.updateGtaoMaterial({ radius: 1, distanceExponent: 1.6, thickness: 1, scale: 1.1, samples: 12, distanceFallOff: 1, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 12 });
composer.addPass(gtao);
const DOF = {
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: gtao.depthTexture },
    uNear: { value: 0.1 }, uFar: { value: 100 }, uFocus: { value: 10 }, uAperture: { value: 0 }, uMaxBlur: { value: 0 },
    uTexel: { value: new THREE.Vector2(1, 1) },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    #include <packing>
    uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform float uNear; uniform float uFar; uniform float uFocus;
    uniform float uAperture; uniform float uMaxBlur; uniform vec2 uTexel; varying vec2 vUv;
    float linZ(vec2 uv) { float d = texture2D(tDepth, uv).x; return perspectiveDepthToViewZ(d, uNear, uFar) * -1.0; }
    float coc(float z) { return clamp(uAperture * abs(z - uFocus) / max(z, 1e-6), 0.0, 1.0) * uMaxBlur; }
    void main() {
      vec4 base = texture2D(tDiffuse, vUv);
      base.rgb = min(base.rgb, vec3(2.5));                                  // tame specular spikes before bloom
      if (uMaxBlur < 0.5) { gl_FragColor = base; return; }
      float c0 = coc(linZ(vUv));
      vec3 acc = base.rgb; float wsum = 1.0;
      const float GA = 2.39996323;
      for (int i = 1; i < 24; i++) {
        float fi = float(i), r = sqrt(fi / 24.0), a = fi * GA;
        vec2 o = vec2(cos(a), sin(a)) * r;
        vec2 uv = vUv + o * c0 * uTexel;
        float cs = coc(linZ(uv));
        float w = smoothstep(0.0, 1.0, cs / max(c0, 1e-3) + 0.2) ;            // keep sharp foreground from bleeding
        acc += min(texture2D(tDiffuse, uv).rgb, vec3(2.5)) * w; wsum += w;
      }
      gl_FragColor = vec4(acc / wsum, base.a);
    }`,
};
const dofPass = new ShaderPass(DOF);
composer.addPass(dofPass);
// electron-microscope look (secondary-electron image): grey scale, brighter slopes and edges (the "edge effect"),
// local contrast, fine detector noise and faint scan lines. The green on/off highlights stay in colour, as in an
// annotated micrograph. uSem blends it in and out (0 = the normal colour image).
const SEM = {
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: gtao.depthTexture }, uNear: { value: 0.1 }, uFar: { value: 100 },
    uTexel: { value: new THREE.Vector2(1, 1) }, uSem: { value: 0 }, uSeed: { value: 0 }, uEdge: { value: 1 },
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    #include <packing>
    uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform float uNear; uniform float uFar; uniform vec2 uTexel;
    uniform float uSem; uniform float uSeed; uniform float uEdge; varying vec2 vUv;
    float linZ(vec2 uv) { float d = texture2D(tDepth, uv).x; return perspectiveDepthToViewZ(d, uNear, uFar) * -1.0; }
    float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233)) + uSeed) * 43758.5453); }
    float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      if (uSem < 0.001) { gl_FragColor = c; return; }
      float L = lum(c.rgb); L = L / (L + 0.5);                     // compress highlights: a detector, not a camera
      float Ln = 0.25 * (lum(texture2D(tDiffuse, vUv + vec2(uTexel.x, 0.0)).rgb) + lum(texture2D(tDiffuse, vUv - vec2(uTexel.x, 0.0)).rgb)
                       + lum(texture2D(tDiffuse, vUv + vec2(0.0, uTexel.y)).rgb) + lum(texture2D(tDiffuse, vUv - vec2(0.0, uTexel.y)).rgb));
      Ln = Ln / (Ln + 0.5);
      float z = linZ(vUv);
      vec2 o = uTexel * 1.5;
      float zx = linZ(vUv + vec2(o.x, 0.0)) - linZ(vUv - vec2(o.x, 0.0)), zy = linZ(vUv + vec2(0.0, o.y)) - linZ(vUv - vec2(0.0, o.y));
      float edge = clamp(length(vec2(zx, zy)) / max(z, 1e-9) * 90.0, 0.0, 1.0);
      float s = 0.035 + L * 0.5 + (L - Ln) * 0.55 + edge * 0.16 * uEdge;
      s += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.01;   // fixed, faint (no temporal flicker)
      vec3 sem = vec3(max(s, 0.0)) * vec3(0.95, 0.985, 1.02);
      float g = clamp((c.g - max(c.r, c.b)) * 2.2, 0.0, 1.0);
      sem = mix(sem, c.rgb, g);
      gl_FragColor = vec4(mix(c.rgb, sem, uSem), c.a);
    }`,
};
const semPass = new ShaderPass(SEM);
composer.addPass(semPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.26, 0.5, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const GRAIN = {
  uniforms: { tDiffuse: { value: null }, uSeed: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uSeed; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uSeed) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); float g = h(gl_FragCoord.xy) - 0.5; gl_FragColor = vec4(c.rgb + g * 0.018, c.a); }`,
};
const grainPass = new ShaderPass(GRAIN);
composer.addPass(grainPass);
// per-frame: everything scales with the camera distance D (world mm) so one setting works from nm to m
function updatePost(D, t) {
  gtao.updateGtaoMaterial({ radius: D * 0.06 });
  const macro = smoother(clamp01((3.1 - Math.log10(D)) / 1.3));     // 0 for the hall, 1 for the die and below
  DOF.uniforms.uNear.value = camera.near; DOF.uniforms.uFar.value = camera.far;
  dofPass.uniforms.uNear.value = camera.near; dofPass.uniforms.uFar.value = camera.far;
  dofPass.uniforms.uFocus.value = D;
  dofPass.uniforms.uAperture.value = 0.9;
  dofPass.uniforms.uMaxBlur.value = 11 * macro;
  semPass.uniforms.uNear.value = camera.near; semPass.uniforms.uFar.value = camera.far;
  semPass.uniforms.uSeed.value = (Math.floor(t * 24) % 89) * 1.13;
  grainPass.uniforms.uSeed.value = (Math.floor(t * 24) % 97) * 1.37;   // periodic with the loop
}
function resizePost(s, pr) {
  composer.setPixelRatio(pr);
  composer.setSize(s, s);
  gtao.setSize(Math.round(s * pr / 2), Math.round(s * pr / 2));        // AO at half resolution (upsampled in the blend)
  dofPass.uniforms.uTexel.value.set(1 / (s * pr), 1 / (s * pr));
  semPass.uniforms.uTexel.value.set(1 / (s * pr), 1 / (s * pr));
  bloom.resolution.set(s * pr / 2, s * pr / 2);
}

/* =====================================================================================
   4. GB202 FULL-CHIP SCHEMATIC  (die-local units "u": 1 u = one SM width)
   Logical organization follows Fig. 3/4/5 (pp. 8–10). Proportions, block heights and gaps are
   explanatory choices — this is NOT a measured floorplan. Each bank of six GPCs is folded 3×2 so
   the chip reads in a square frame; each GPC keeps its Fig. 4 order (Raster Engine, 8 TPCs × 2 SMs,
   2 ROP partitions). L2 sits between the two opposing banks; the 16 memory controllers flank them.
   ===================================================================================== */
const U = {
  smW: 1.0, smD: 1.5, tpcGap: 0.12, smGapZ: 0.08,
  gpcPadX: 0.2, gpcPadZ: 0.14, rasterD: 0.26, ropD: 0.2, stripGap: 0.1,
  gpcGap: 0.4, l2D: 3.0, bankGap: 0.4, hostD: 0.8, mcW: 1.05, mcGap: 0.35, margin: 0.5,
  gpcCols: 3, gpcRowsPerBank: 2,
};
U.gpcW = ARCH.tpcPerGpc * U.smW + (ARCH.tpcPerGpc - 1) * U.tpcGap + 2 * U.gpcPadX;
U.tpcD = ARCH.smPerTpc * U.smD + (ARCH.smPerTpc - 1) * U.smGapZ;
U.gpcD = 2 * U.gpcPadZ + U.rasterD + U.stripGap + U.tpcD + U.stripGap + U.ropD;
U.bankW = U.gpcCols * U.gpcW + (U.gpcCols - 1) * U.gpcGap;
U.bankD = U.gpcRowsPerBank * U.gpcD + (U.gpcRowsPerBank - 1) * U.gpcGap;
U.bankZ = U.l2D / 2 + U.bankGap + U.bankD / 2;
U.mcX = U.bankW / 2 + U.mcGap + U.mcW / 2;
U.dieW = 2 * (U.mcX + U.mcW / 2 + 0.55 + U.margin);
U.dieZ0 = -(U.bankZ + U.bankD / 2 + 0.3 + U.hostD + U.margin);
U.dieZ1 = U.bankZ + U.bankD / 2 + U.margin + 0.6;
U.dieD = U.dieZ1 - U.dieZ0;
U.dieCZ = (U.dieZ0 + U.dieZ1) / 2;
console.assert(ARCH.gpcs === 2 * U.gpcCols * U.gpcRowsPerBank, 'GPC arrangement must hold all 12 GPCs');

const MM_PER_U = Math.sqrt(ARCH.dieAreaMM2 / (U.dieW * U.dieD));   // die footprint = documented 750 mm² (aspect is artistic)
const DIE_THICK = 0.8;       // u

// block kinds -> [color, metalness, roughness]
const KIND = {
  gpcPlate: [0x1c2023, 0.5, 0.55], smPlate: [0x252a2d, 0.55, 0.48], partPlate: [0x2b3134, 0.6, 0.45],
  cell: [0x3b4341, 0.62, 0.36], tensor: [0x3d4a37, 0.6, 0.34], sched: [0x8f5c36, 0.92, 0.3],
  reg: [0x4c5966, 0.78, 0.3], ldst: [0x5b4737, 0.72, 0.4], sfu: [0x6f4731, 0.8, 0.36],
  l1: [0x9ba3a9, 0.92, 0.25], tex: [0x636d76, 0.82, 0.32], rt: [0xa6844a, 0.95, 0.3], rtEng: [0xcaa662, 1.0, 0.24],
  raster: [0x4c5966, 0.78, 0.3], rop: [0x5e676f, 0.8, 0.34], l2: [0x6a7684, 0.72, 0.36],
  mc: [0x7b5337, 0.92, 0.33], phy: [0xb9954f, 1.0, 0.28], host: [0x4c5966, 0.78, 0.3], host2: [0x5e676f, 0.8, 0.34],
};
const PAT = { none: 0, cuda: 1, l2: 2, tex: 3, systolic: 4, sram: 5, logic: 6 };
const CHIP_RBOX = new RoundedBoxGeometry(1, 1, 1, 2, 0.02);      // crisper edges than the shared bevel box

const chipRecs = [];
const gpcInfo = [];  // { x, z, bank, row, col, mirror }
function rec(kind, x, z, w, d, base, h, o = {}) {
  chipRecs.push({ kind, x, z, w, d, y: base + h / 2, h, gpc: o.gpc ?? -1, region: o.region ?? -1,
    hier: o.hier ?? 0, sweep: o.sweep ?? 0, pat: o.pat ?? PAT.none, cell: o.cell ?? -1, sel: o.sel ?? 0, part: o.part ?? 0 });
}

// Selected SM: inner row of the upper bank, middle column, TPC 3, lower SM (nearest the L2).
const SEL = { gpc: 4, tpc: 3, sm: 1 };

// SM internal layout (Fig. 5), SM-local z from -smD/2 (partition row 1) to +smD/2 (RT core).
const SMZ = { r1: [-0.72, -0.26], r2: [-0.23, 0.23], l1: [0.26, 0.33], tex: [0.35, 0.41], rt: [0.44, 0.72] };
const PART_X = [[-0.47, -0.015], [0.015, 0.47]];
const PW = 0.455;
const PZ = { sched: [0, 0.035], reg: [0.045, 0.095], main: [0.107, 0.407], ldst: [0.419, 0.454] };
const CUDA_W = 0.26, TENSOR_X0 = 0.275;
const SM_BASE = 0.06; // top of SM plate

function buildSM(cx, cz, mz, g, hierLvl, sel, hi) {
  // mz = +1 or -1: mirror of SM-local z for the lower bank (opposing banks)
  const Z = (a, b) => [cz + mz * (a + b) / 2, Math.abs(b - a)];
  const common = { gpc: g, hier: hierLvl, sel: sel ? 1 : 0 };
  rec('smPlate', cx, cz, U.smW - 0.02, U.smD - 0.02, 0.04, 0.02, common);
  const rows = [SMZ.r1, SMZ.r2];
  for (let pr = 0; pr < 2; pr++) for (let pc = 0; pc < 2; pc++) {
    const [x0] = PART_X[pc];
    const [z0] = rows[pr];
    const region = pr * 2 + pc;
    const o = { ...common, region: sel ? region : -1, part: sel && region === 3 ? 1 : 0 };
    const px = (a, b) => cx + x0 + (a + b) / 2;
    if (hi) {
      rec('partPlate', px(0, PW), Z(z0, z0 + 0.46)[0], PW, 0.46, SM_BASE, 0.012, o);
      const b = SM_BASE + 0.012;
      rec('sched', px(0, PW), Z(z0 + PZ.sched[0], z0 + PZ.sched[1])[0], PW, 0.035, b, 0.035, o);
      rec('reg', px(0, PW), Z(z0 + PZ.reg[0], z0 + PZ.reg[1])[0], PW, 0.05, b, 0.05, o);
      // 32 CUDA cores per partition (DERIVED), drawn as CORE_COLS × CORE_ROWS cells
      const pitchX = CUDA_W / CORE_COLS, pitchZ = (PZ.main[1] - PZ.main[0]) / CORE_ROWS;
      for (let i = 0; i < CORE_COLS; i++) for (let j = 0; j < CORE_ROWS; j++) {
        const zz = z0 + PZ.main[0] + (j + 0.5) * pitchZ;
        rec('cell', cx + x0 + (i + 0.5) * pitchX, cz + mz * zz, pitchX * 0.8, pitchZ * 0.78, b, 0.07, { ...o, sweep: 1, cell: sel ? region * 100 + i * 10 + j : -1 });
      }
      rec('tensor', px(TENSOR_X0, PW), Z(z0 + PZ.main[0], z0 + PZ.main[1])[0], PW - TENSOR_X0, 0.3, b, 0.13, { ...o, sweep: 1 });
      const lw = (PW - 0.04) / 5;
      for (let k = 0; k < 5; k++) {
        rec(k < 4 ? 'ldst' : 'sfu', cx + x0 + 0.004 + (k + 0.5) * (lw + 0.008), Z(z0 + PZ.ldst[0], z0 + PZ.ldst[1])[0], lw, 0.035, b, 0.035, o);
      }
    } else {
      rec('reg', px(0, PW), Z(z0, z0 + PZ.reg[1])[0], PW, PZ.reg[1], SM_BASE, 0.05, o);
      rec('cell', px(0, CUDA_W), Z(z0 + PZ.main[0], z0 + PZ.main[1])[0], CUDA_W, 0.3, SM_BASE, 0.07, { ...o, pat: PAT.cuda, sweep: 0.45 });
      rec('tensor', px(TENSOR_X0, PW), Z(z0 + PZ.main[0], z0 + PZ.main[1])[0], PW - TENSOR_X0, 0.3, SM_BASE, 0.13, { ...o, sweep: 0.45 });
      rec('ldst', px(0, PW), Z(z0 + PZ.ldst[0], z0 + PZ.ldst[1])[0], PW, 0.035, SM_BASE, 0.035, o);
    }
  }
  const oL1 = { ...common, region: sel ? 4 : -1 };
  rec('l1', cx, Z(...SMZ.l1)[0], 0.94, 0.07, SM_BASE, 0.06, oL1);
  if (hi) {
    const tw = (0.94 - 0.03 * (ARCH.sm.texUnits - 1)) / ARCH.sm.texUnits;
    for (let k = 0; k < ARCH.sm.texUnits; k++) rec('tex', cx - 0.47 + tw / 2 + k * (tw + 0.03), Z(...SMZ.tex)[0], tw, 0.06, SM_BASE, 0.045, oL1);
  } else {
    rec('tex', cx, Z(...SMZ.tex)[0], 0.94, 0.06, SM_BASE, 0.045, { ...oL1, pat: PAT.tex });
  }
  const oRT = { ...common, region: sel ? 5 : -1 };
  rec('rt', cx, Z(...SMZ.rt)[0], 0.94, 0.28, SM_BASE, hi ? 0.05 : 0.08, oRT);
  if (hi) {
    // Fig. 5 RT Core sub-engines: box intersection, triangle cluster intersection, linear swept spheres,
    // opacity micromap, triangle cluster compression (5 blocks, no labels needed).
    const eb = SM_BASE + 0.05;
    [[-0.3, 0.49], [0, 0.49], [0.3, 0.49]].forEach(([ex, ez]) => rec('rtEng', cx + ex, cz + mz * (ez + 0.05), 0.26, 0.1, eb, 0.05, oRT));
    [[-0.16, 0.63], [0.16, 0.63]].forEach(([ex, ez]) => rec('rtEng', cx + ex, cz + mz * ez, 0.28, 0.1, eb, 0.05, oRT));
  }
}

// ---- lay out 12 GPCs ----
let selCenter = null, tpcCenter = null;
for (let bank = 0; bank < 2; bank++) {
  const bz = (bank === 0 ? -1 : 1) * U.bankZ;
  const mz = bank === 0 ? 1 : -1;               // lower bank mirrored: raster engines face outward
  for (let row = 0; row < U.gpcRowsPerBank; row++) for (let col = 0; col < U.gpcCols; col++) {
    const g = gpcInfo.length;
    // row 0 = outer row, row 1 = inner row (next to L2)
    const rz = (row === 0 ? -1 : 1) * (U.gpcD + U.gpcGap) / 2 * mz;
    const gx = -U.bankW / 2 + U.gpcW / 2 + col * (U.gpcW + U.gpcGap);
    const gz = bz + rz;
    gpcInfo.push({ x: gx, z: gz, bank, row, col, mz });
    const inSelGpc = g === SEL.gpc;
    rec('gpcPlate', gx, gz, U.gpcW, U.gpcD, 0, 0.04, { gpc: g, hier: inSelGpc ? 1 : 0 });
    const top = gz - mz * U.gpcD / 2;   // "top" edge of the GPC in Fig. 4 terms
    rec('raster', gx, top + mz * (U.gpcPadZ + U.rasterD / 2), U.gpcW - 0.4, U.rasterD, 0.04, 0.08, { gpc: g, hier: inSelGpc ? 1 : 0 });
    const ropW = (U.gpcW - 0.4 - 0.2) / ARCH.ropPartitionsPerGpc;
    for (let k = 0; k < ARCH.ropPartitionsPerGpc; k++) {
      rec('rop', gx - (U.gpcW - 0.4) / 2 + ropW / 2 + k * (ropW + 0.2), gz + mz * (U.gpcD / 2 - U.gpcPadZ - U.ropD / 2), ropW, U.ropD, 0.04, 0.06, { gpc: g, hier: inSelGpc ? 1 : 0 });
    }
    for (let tpc = 0; tpc < ARCH.tpcPerGpc; tpc++) {
      const sx = gx - U.gpcW / 2 + U.gpcPadX + U.smW / 2 + tpc * (U.smW + U.tpcGap);
      for (let s = 0; s < ARCH.smPerTpc; s++) {
        const sz = top + mz * (U.gpcPadZ + U.rasterD + U.stripGap + U.smD / 2 + s * (U.smD + U.smGapZ));
        const isSel = inSelGpc && tpc === SEL.tpc && s === SEL.sm;
        const inTpc = inSelGpc && tpc === SEL.tpc;
        const lvl = isSel ? 3 : inTpc ? 2 : inSelGpc ? 1 : 0;
        buildSM(sx, sz, mz, g, lvl, isSel, true);
        if (isSel) { selCenter = new THREE.Vector3(sx, 0, sz); SEL.mz = mz; }
        if (inTpc && s === 0) tpcCenter = new THREE.Vector3(sx, 0, top + mz * (U.gpcPadZ + U.rasterD + U.stripGap + U.tpcD / 2));
      }
    }
  }
}
SEL.center = selCenter; SEL.tpcCenter = tpcCenter;
SEL.gpcCenter = new THREE.Vector3(gpcInfo[SEL.gpc].x, 0, gpcInfo[SEL.gpc].z);
// The one CUDA core the camera enters: lower-right partition, column 1, row 3 of its FP32/INT32 grid.
SEL.cellIdx = chipRecs.findIndex(r => r.cell === 3 * 100 + 1 * 10 + 3);
{ const r = chipRecs[SEL.cellIdx]; SEL.cell = { x: r.x, base: r.y - r.h / 2, z: r.z, w: r.w, h: r.h, d: r.d }; }

// ---- L2 cache between the banks (128 MB, p.9): 2 × 16 slices ----
{
  const n = 16, gap = 0.08, w = (U.bankW - (n - 1) * gap) / n, d = (U.l2D - 0.12) / 2;
  for (let r = 0; r < 2; r++) for (let i = 0; i < n; i++) {
    rec('l2', -U.bankW / 2 + w / 2 + i * (w + gap), (r === 0 ? -1 : 1) * (d / 2 + 0.06), w, d, 0, 0.16, { pat: PAT.l2, sweep: 0.2 });
  }
}
// ---- 16 × 32-bit memory controllers (8 per side) + PHY edge strips ----
{
  const perSide = ARCH.memControllers / 2, span = 2 * (U.bankZ + U.bankD / 2), pitch = span / perSide;
  for (const side of [-1, 1]) for (let i = 0; i < perSide; i++) {
    const z = -span / 2 + pitch * (i + 0.5);
    rec('mc', side * U.mcX, z, U.mcW, pitch - 0.22, 0, 0.14);
    rec('phy', side * (U.mcX + U.mcW / 2 + 0.3), z, 0.3, pitch - 0.22, 0, 0.05);
  }
}

/* =====================================================================================
   8. MASTER TIMELINE — every pose below is a pure function of authored time τ ∈ [0, 187), played back through a
   smooth speed profile (WARP) in about 154 s. Nothing accumulates
   between frames, so loop N+1 is bit-identical to loop 1. The last seconds are designed to arrive
   in the exact camera pose, geometry state, lighting and animation phase of t = 0.
     0–5     the data hall, down the aisle to one rack          5–10    the server slides out, cover opens
     10–16   the RTX PRO 6000 is lifted out, shown back-up, rolled over to its fans
     16–21   the board is taken apart                            21–35   die → schematic → GPCs, L2 → TPC → SM
     35–46   one processing block; the SM becomes silicon; the block's scheduler, register file, cores
     46–72   the register file under the electron microscope: arrays → memory cells → one 6-transistor cell
     72–84   back out to the 32 CUDA cores; one core; its floorplan (a generic FP32 fused multiply-add unit)
     84–122  into the electron microscope: one continuous zoom into the multiplier, polished down to the transistors
     122–132 one full-adder tile, one XOR cell
     132–145 one transistor cut in half; gate, fin, channel    145–168 the channel as atoms; one atom's four bonds
     168–187 continuous pull-back: everything re-assembles, the server returns to the rack, the hall
   ===================================================================================== */
const LOOP_T = 187;                        // the authored timeline (τ); playback runs through a smooth time warp (below)

function gpcExplode(t, g) {

function renderAt(tPlay) {
  const t = WARP.toTau(tPlay);             // authored time
  applyState(t);

  applyWorldUniforms(t);
  applyCaption(t);
  applyHud();
  applyTags(t);
  updatePost(CAM.D, t);
  const fieldMm = 2 * CAM.D * Math.tan(camera.fov * deg / 2);
  const sem = semOfField(fieldMm); semPass.uniforms.uSem.value = sem; applySemLook(sem);
  const fade = applyPatchFade(fieldMm), relief = FADE_DEV.value > 0 || FADE_SRAM.value > 0;
  gtao.blendIntensity = 0.9 * (relief ? fade : 1); semPass.uniforms.uEdge.value = relief ? fade : 1;   // AO / edge light fade in with the relief
  dofPass.uniforms.uMaxBlur.value *= (1 - 0.55 * pulse(t, 37.0, 39.0, 172.0, 174.0) - 0.3 * pulse(t, 93.5 + D2, 96.0 + D2, 126.8 + D2, 128.0 + D2)) * (1 - 0.75 * sem);   // electron microscopes have a deep focus; keep sections and the lattice readable

}

  },
  // camera position in true (unshifted) world coordinates
  camAt(tp) { const t = WARP.toTau(tp); applyState(t); placeCamera(t); return { pos: camera.position.clone().add(CAM_T_WORLD).toArray(), D: CAM.D, T: CAM_T_WORLD.toArray() }; },
  // QA: is the camera ever inside a hardware mesh, an instanced part, a schematic block, the glass of a wiring
  // level (outside its crater), the transistor layer or the sectioned cell? (every 20 ms)
  insideCheck() {
    const hits = [], box = new THREE.Box3(), unit = new THREE.Box3(new THREE.Vector3(-0.5, -0.5, -0.5), new THREE.Vector3(0.5, 0.5, 0.5));
    const inv = new THREE.Matrix4(), im4 = new THREE.Matrix4(), p = new THREE.Vector3();
    const meshes = [], inst = [];
    [cardRoot, serverGroup, heroRack].forEach(r => r.traverse(o => {
      if (CHIP_MESHES.includes(o) || o === slabGroup || o === phyGroup || o === sramGroup) return;
      let deep = false; for (let q = o; q; q = q.parent) if (q === phyGroup || q === slabGroup || q === sramGroup) deep = true;
      if (deep) return;
      if (o.isInstancedMesh) { if (o.geometry.type === 'BoxGeometry' || o.geometry.type === 'RoundedBoxGeometry') inst.push(o); }
      else if (o.isMesh) meshes.push(o);
    }));
    const inDeep = (t, cpos) => {
      if (slabGroup.visible) {                                  // under the slab top but outside its one open window
        const q = cpos.clone().applyMatrix4(new THREE.Matrix4().copy(chipGroup.matrixWorld).invert());
        const inSlab = Math.abs(q.x - SLAB.x) < SLAB.w / 2 && Math.abs(q.z - SLAB.z) < SLAB.d / 2 && q.y > SLAB.devY && q.y < SLAB.top;
        if (inSlab && !(Math.abs(q.x - SLAB_HOLE.c.x) < SLAB_HOLE.r && Math.abs(q.z - SLAB_HOLE.c.z) < SLAB_HOLE.r)) return 'slab';
      }
      if (sramGroup.visible) {
        const q = cpos.clone().applyMatrix4(new THREE.Matrix4().copy(sramGroup.matrixWorld).invert());
        if (q.y < 0.065 && Math.abs(q.x) < SR.NC * SR.CW && Math.abs(q.z) < SR.NR * SR.CH) return 'memory cells';
      }
      if (!phyGroup.visible) return null;
      if (cpos.clone().applyMatrix4(new THREE.Matrix4().copy(phyGroup.matrixWorld).invert()).y < DEV.STI) {       // below the sample surface
        const q = cpos.clone().applyMatrix4(new THREE.Matrix4().copy(phyGroup.matrixWorld).invert());
        return 'below the surface';
      }
      inv.copy(phyGroup.matrixWorld).invert(); p.copy(cpos).applyMatrix4(inv);
      const m = Math.max(Math.abs(p.x), Math.abs(p.z));
      if (p.y < DEV_TOP && m < DEV.P) {
        const open = p.z > 0.075 || (Math.abs(p.x) < 0.225 && p.z > ZC / 1000 + 1e-4);   // the channel, and the milled half
        if (!open) return 'transistor layer';
      }
      inv.copy(devGroup.matrixWorld).invert(); p.copy(cpos).applyMatrix4(inv);
      if (devGroup.visible && p.y < 90 && Math.abs(p.x) < 226 && p.z > -130 && p.z < ZC) return 'cell section';
      return null;
    };
    for (let t = 0; t < LOOP_T; t += 0.02) {
      applyState(t); placeCamera(t);
      const cpos = camera.position;
      for (const m of meshes) { if (!m.visible || !m.parent.visible) continue; box.setFromObject(m); if (box.containsPoint(cpos)) hits.push([+t.toFixed(2), 'mesh', m.geometry.type]); }
      for (const m of inst) {
        let vis = true; for (let o = m; o; o = o.parent) if (!o.visible) vis = false;
        if (!vis) continue;
        for (let k = 0; k < m.count; k++) { m.getMatrixAt(k, im4); box.copy(unit).applyMatrix4(im4.premultiply(m.matrixWorld)); if (box.containsPoint(cpos)) { hits.push([+t.toFixed(2), 'instanced', '#' + m.material.color.getHexString(), k, m.count]); break; } }
      }
      const d = inDeep(t, cpos); if (d) hits.push([+t.toFixed(2), 'deep', d]);
      inv.copy(chipGroup.matrixWorld).invert(); p.copy(cpos).applyMatrix4(inv);
      for (let i = 0; i < CHIP_N; i++) {
        if (!CHIP_MESHES[CHIP_MESH[i]].visible) continue;
        const [a, o] = chipMatrixOf(i);
        if (a[o] > 0 && a[o + 5] > 1e-4 && Math.abs(p.x - a[o + 12]) < a[o] / 2 && Math.abs(p.y - a[o + 13]) < a[o + 5] / 2 && Math.abs(p.z - a[o + 14]) < a[o + 10] / 2) { hits.push([+t.toFixed(2), 'chip', chipRecs[i].kind]); break; }
      }
    }
    return { samples: Math.round(LOOP_T / 0.02), hits: hits.length, first: hits.slice(0, 30).map(h => [+WARP.toT(h[0]).toFixed(2), ...h]) };
  },
};

try {
  warmup();
  window.__started = true;
  clearTimeout(window.__bootTimer);
  base = performance.now();
  requestAnimationFrame(frame);
} catch (e) {
  console.error(e);
  window.__showError('Rendering failed to start: ' + (e && e.message ? e.message : e));
}
</script>
