<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untitled Film</title>
<!--
  UNTITLED FILM — one line: from where to where
  A real-time 3D loop (Three.js r160, WebGL2). Silent. No input required.
  FORMAT: the #frame element's data-aspect / data-langs / data-length (set by new_film.sh from the kickoff answers).

  STORY: (one paragraph: where it starts, every step, where it ends, how the loop closes)
  DATA (real): (every source behind a number on screen)
  LOOK: (lighting, exposure, anything stylised and why)
  ILLUSTRATIVE (and labelled so on screen): (every part that is not measured or not public)
  PACING: authored at a comfortable pace, played through a speed profile built from the beats
  (hook/key ×2, normal ×3.5, transit ×8, return ×3), so one loop runs ~N s.
  Keys (optional): Space = pause/resume · R = restart · H = hide/show text.
  URL: ?t=seconds · ?freeze (QA) · ?safe (show the Shorts UI zones) · ?text=0 (no text layers)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Semi+Condensed:wght@500&family=Noto+Sans+KR:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #05070a;
    --ink: #eef1f4;
    --ink-dim: #a7b0ba;
    --accent: #8fd3ff;
    /* the script font of the film's languages (Noto Sans KR / JP / SC …; new_film.sh sets it and the font link above) */
    --face-lang: "Noto Sans KR";
    --face: "Barlow", "Helvetica Neue", "Segoe UI", Arial, var(--face-lang), sans-serif;
    --face-sub: "Barlow Semi Condensed", "Barlow", "Helvetica Neue", Arial, var(--face-lang), sans-serif;
    /* the second-language line (the API's `ko` argument; Korean by default) */
    --face-ko: var(--face-lang), "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
  body { color: var(--ink); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); }
  /* the frame: 9:16 (Shorts / Reels / TikTok) unless data-aspect says otherwise. Text is sized in cqmin (1% of the frame's short
     side), so it has the same pixel size in a 1080 × 1920 and a 1920 × 1080 recording */
  #frame {
    --arw: 9; --arh: 16;
    position: relative; width: min(100vw, calc(100vh * var(--arw) / var(--arh))); aspect-ratio: var(--arw) / var(--arh);
    overflow: hidden; background: var(--bg); container-type: size;
  }
  #frame[data-aspect="16x9"] { --arw: 16; --arh: 9; }
  #frame[data-aspect="1x1"]  { --arw: 1;  --arh: 1; }
  #frame[data-aspect="4x5"]  { --arw: 4;  --arh: 5; }
  #frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grade {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(135% 95% at 50% 44%, rgba(0,0,0,0) 58%, rgba(0,0,0,.38) 100%);
  }
  #black { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 1; }
  /* the caption block sits above the bottom fifth and clear of the right edge, where the Shorts player draws its own UI */
  #caption {
    position: absolute; left: 7%; right: 15%; bottom: 21%;
    pointer-events: none; opacity: 0; will-change: opacity, transform;
  }
  #caption::before {             /* soft scrim so the lines stay readable over bright subjects */
    content: ''; position: absolute; z-index: -1; left: -14%; right: -10%; top: -45%; bottom: -60%;
    background: radial-gradient(70% 62% at 34% 62%, rgba(3,5,8,.66), rgba(3,5,8,.34) 55%, rgba(3,5,8,0) 100%);
  }
  #caption .rule { width: 2.6cqmin; min-width: 14px; height: 2px; background: var(--accent); margin-bottom: 1.4cqmin; }
  #cap-main {
    font-family: var(--face); font-weight: 600; text-transform: uppercase;
    font-size: clamp(15px, 3.6cqmin, 60px); line-height: 1.08; letter-spacing: .06em;
    text-wrap: balance; text-shadow: 0 1px 12px rgba(0,0,0,.6);
  }
  #cap-sub {
    font-family: var(--face-sub); font-weight: 500; text-transform: uppercase;
    font-size: clamp(11px, 1.95cqmin, 32px); line-height: 1.3; letter-spacing: .1em;
    color: var(--ink-dim); margin-top: .7em; text-wrap: balance; text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 1px 12px rgba(0,0,0,.6);
  }
  #cap-ko {
    font-family: var(--face-ko); font-weight: 500; font-size: clamp(11px, 1.85cqmin, 30px); line-height: 1.42;
    letter-spacing: .01em; color: #ccd4dc; margin-top: .45em; text-wrap: balance; word-break: keep-all;
    text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 1px 12px rgba(0,0,0,.6);
  }
  #frame.nolabels #caption, #frame.nolabels #hud, #frame.nolabels #tags, #frame.nolabels #callouts,
  #frame.nolabels #leaders, #frame.nolabels #leadlabs, #frame.nolabels #scale { display: none; }
  /* labels pinned to the 3D view: English name, Korean in parentheses, a dot on the object */
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #tags .tag { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  #tags .tag > div { position: absolute; left: 0; bottom: 0; transform: translate(-50%, -12px); white-space: nowrap; text-align: center;
    padding: .3em .6em .34em; background: rgba(6,9,13,.66); border: 1px solid rgba(143,211,255,.45); border-radius: 3px; }
  #tags .tag.below > div { bottom: auto; top: 0; transform: translate(-50%, 12px); }
  #tags .tag b { display: block; font: 600 clamp(8px, 1.42cqmin, 22px)/1.15 var(--face); letter-spacing: .03em; color: #eef3f6; }
  #tags .tag i { display: block; font: 500 clamp(7px, 1.22cqmin, 19px)/1.2 var(--face-ko); font-style: normal; color: #c9d1d9; margin-top: .12em; }
  #tags .tag::before { content: ''; position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 6px rgba(143,211,255,.9); }
  #tags .tag::after { content: ''; position: absolute; left: -.5px; bottom: 0; width: 1px; height: 12px; background: rgba(143,211,255,.7); }
  #tags .tag.below::after { bottom: auto; top: 0; }
  #tags .tag.hyp > div { border-style: dashed; border-color: rgba(255,210,140,.6); }
  #tags .tag.hyp::before { background: #ffd28c; box-shadow: 0 0 6px rgba(255,210,140,.9); }
  #tags .tag.hyp::after { background: rgba(255,210,140,.7); }
  /* a comparison right after a reveal: the ratio beside the new subject, a short connector to its edge */
  #callouts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .co { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  .co .lab { position: absolute; left: 0; top: 0; white-space: nowrap; padding: .34em .7em .4em; background: rgba(6,9,13,.72);
    border-left: 2px solid var(--accent); transform: translate(-50%, -50%); text-align: left; }
  .co .lab b { display: block; font: 600 clamp(12px, 2.6cqmin, 42px)/1 var(--face); color: #eaf6ff; letter-spacing: .02em; }
  .co .lab span { display: block; font: 500 clamp(8px, 1.35cqmin, 21px)/1.25 var(--face-sub); color: #c6d4de; letter-spacing: .06em; text-transform: uppercase; margin-top: .3em; }
  .co .lab i { display: block; font: 500 clamp(8px, 1.3cqmin, 20px)/1.25 var(--face-ko); font-style: normal; color: #c9d1d9; margin-top: .15em; }
  /* leader labels: a ring on a subject too small to see well, a thin line, and its name */
  #leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #leaders circle { fill: none; stroke: rgba(143,211,255,.95); stroke-width: 1.4; }
  #leaders polyline { fill: none; stroke: rgba(143,211,255,.8); stroke-width: 1.1; }
  #leadlabs { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #leadlabs .ld { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; }
  #leadlabs .ld > div { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; padding: .28em .62em .32em;
    background: rgba(6,9,13,.72); border: 1px solid rgba(143,211,255,.5); border-radius: 3px; transform: translate(-50%, -100%); }
  #leadlabs .ld b { display: block; font: 600 clamp(8px, 1.42cqmin, 22px)/1.15 var(--face); letter-spacing: .03em; color: #eef3f6; }
  #leadlabs .ld i { display: block; font: 500 clamp(7px, 1.22cqmin, 19px)/1.2 var(--face-ko); font-style: normal; color: #c9d1d9; margin-top: .12em; }
  /* field-of-view ruler, top right, below the Shorts player's top bar (its buttons sit lower on the right) */
  #hud { position: absolute; right: 4.5%; top: 11%; height: 27%; width: 30cqmin; pointer-events: none; }
  #hud-title { position: absolute; right: 0; top: -2.9cqmin; font: 500 clamp(8px, 1.3cqmin, 20px)/1 var(--face-sub); letter-spacing: .14em;
    text-transform: uppercase; color: rgba(233,238,242,.5); white-space: nowrap; }
  #hud-title span { font-family: var(--face-ko); letter-spacing: 0; text-transform: none; }
  #hud-line { position: absolute; right: 0; top: 0; bottom: 0; width: 1px; background: rgba(233,238,242,.25); }
  #hud .tick { position: absolute; right: 0; width: .9cqmin; height: 1px; background: rgba(233,238,242,.4); }
  #hud .tick span { position: absolute; right: 1.5cqmin; top: -.62em; font: 500 clamp(7px, 1.25cqmin, 19px)/1 var(--face-sub);
    letter-spacing: .05em; color: rgba(233,238,242,.42); white-space: nowrap; }
  #hud-mark { position: absolute; right: -.5cqmin; width: 2.2cqmin; height: 2px; margin-top: -1px; background: var(--accent);
    box-shadow: 0 0 8px rgba(143,211,255,.7); }
  #hud-val { position: absolute; right: 12.2cqmin; margin-top: -.62em; font: 600 clamp(9px, 1.7cqmin, 26px)/1 var(--face);
    letter-spacing: .04em; color: #cfeaff; white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.85); }
  /* the scale in human terms (optional; the film fills it or leaves it hidden), top left, below the player's top bar */
  #scale { position: absolute; left: 5%; top: 8.5%; width: 58cqmin; pointer-events: none; opacity: 0; padding-left: .9em;
    border-left: 2px solid var(--accent); will-change: opacity; }
  #scale .k { font: 500 clamp(8px, 1.3cqmin, 20px)/1.3 var(--face-sub); letter-spacing: .14em; text-transform: uppercase; color: rgba(233,238,242,.62); }
  #scale .k span { font-family: var(--face-ko); letter-spacing: 0; text-transform: none; }
  #scale .v { font: 600 clamp(15px, 3.3cqmin, 52px)/1.1 var(--face); color: #eaf6ff; margin-top: .22em; letter-spacing: .01em;
    font-variant-numeric: tabular-nums; text-shadow: 0 1px 10px rgba(0,0,0,.7); white-space: nowrap; }
  #scale .v small { font: 500 clamp(8px, 1.3cqmin, 20px)/1 var(--face-sub); letter-spacing: .12em; text-transform: uppercase; color: rgba(233,238,242,.62); margin-right: .5em; }
  #scale .v i { font: 500 clamp(9px, 1.5cqmin, 23px)/1 var(--face-ko); font-style: normal; color: #c9d1d9; margin-left: .45em; }
  #scale .r { font: 500 clamp(8px, 1.3cqmin, 20px)/1.35 var(--face-sub); color: #cfe0ec; letter-spacing: .04em; margin-top: .45em; text-shadow: 0 1px 6px rgba(0,0,0,.8); }
  #scale .r i { display: block; font: 500 clamp(8px, 1.3cqmin, 20px)/1.4 var(--face-ko); font-style: normal; color: #c3ccd5; letter-spacing: 0; }
  #scale .n { font: 500 clamp(8px, 1.25cqmin, 19px)/1.35 var(--face-sub); color: rgba(233,238,242,.62); margin-top: .5em; letter-spacing: .05em; }
  #scale .n i { display: block; font-family: var(--face-ko); font-style: normal; letter-spacing: 0; }
  /* other frames: the same text design, placed clear of that platform's player UI (layout.md; SAFE_ZONES in the core) */
  #frame[data-aspect="16x9"] #caption { left: 5%; right: 45%; bottom: 13%; }
  #frame[data-aspect="16x9"] #hud { right: 3%; top: 12%; height: 42%; }
  #frame[data-aspect="16x9"] #scale { left: 4%; top: 10%; }
  #frame[data-aspect="1x1"] #caption { left: 6%; right: 22%; bottom: 10%; }
  #frame[data-aspect="1x1"] #hud { right: 4%; top: 8%; height: 34%; }
  #frame[data-aspect="1x1"] #scale { left: 5%; top: 6%; }
  #frame[data-aspect="4x5"] #caption { left: 6%; right: 18%; bottom: 11%; }
  #frame[data-aspect="4x5"] #hud { right: 4%; top: 8%; height: 30%; }
  #frame[data-aspect="4x5"] #scale { left: 5%; top: 6%; }
  /* QA only (?safe): where the player draws its own UI over the video (built from SAFE_ZONES) */
  #safe { position: absolute; inset: 0; pointer-events: none; }
  #safe div { position: absolute; background: rgba(255,40,40,.22); outline: 1px dashed rgba(255,90,90,.8); }
  #err {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 0 10%;
    font: 500 15px/1.5 var(--face); color: var(--ink); text-align: center; background: var(--bg);
  }
  #err b { display: block; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: .5em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div id="frame" data-aspect="9x16" data-langs="en ko" data-length="45-60">
    <div id="grade"></div>
    <div id="tags" aria-hidden="true"></div>
    <svg id="leaders" aria-hidden="true"></svg>
    <div id="leadlabs" aria-hidden="true"></div>
    <div id="callouts" aria-hidden="true"></div>
    <div id="scale" aria-hidden="true"><div class="k"></div><div class="v"></div><div class="r"></div><div class="n"></div></div>
    <div id="hud" aria-hidden="true"><div id="hud-title">Field of view <span>(화면 폭)</span></div><div id="hud-line"></div><div id="hud-mark"></div><div id="hud-val"></div></div>
    <div id="caption"><div class="rule"></div><div id="cap-main"></div><div id="cap-sub"></div><div id="cap-ko" lang="ko"></div></div>
    <div id="safe" hidden></div>
    <div id="black"></div>
    <div id="err" hidden><div><b>Playback unavailable</b><span id="err-msg"></span></div></div>
  </div>
</div>

<script>
  // Classic (non-module) guard: reports a visible error if the module graph never starts.
  window.__showError = function (msg) {
    var box = document.getElementById('err');
    document.getElementById('err-msg').textContent = msg;
    box.hidden = false;
  };
  window.__bootTimer = setTimeout(function () {
    if (!window.__started) window.__showError('The 3D engine did not load (network or CDN blocked). Reload the page to try again.');
  }, 25000);
  window.addEventListener('error', function (e) {
    if (!window.__started && e && e.message) window.__showError('Startup error: ' + e.message);
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
// (a film may add more imports here, e.g. FontLoader + TextGeometry for 3D lettering, Line2 for fat lines)
